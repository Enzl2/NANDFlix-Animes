# Monta o APK de teste do NANDRoll a cada push e o publica em Releases
# ("NANDRoll: APK de teste"), para baixar direto no celular.
#
# O APK sai com outro identificador e outro nome (NANDRoll), para poder ficar
# instalado ao lado do NANDFlix original. A troca é feita só aqui, na hora de
# montar: os arquivos do projeto continuam iguais aos do NANDFlix.
name: APK do NANDRoll

on:
  push:
    branches: [main, nandroll]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-nandroll
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Testes das regras de anime
        run: node scripts/testar-anime.js

      - name: Dependências
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd mobile
          npm ci --no-audit --no-fund

      - name: Identificador e nome do NANDRoll
        run: |
          sed -i 's/applicationId "app.nandflix.celular"/applicationId "app.nandroll.celular"/' mobile/android/app/build.gradle
          sed -i 's|<string name="app_name">NANDFlix</string>|<string name="app_name">NANDRoll</string>|; s|<string name="title_activity_main">NANDFlix</string>|<string name="title_activity_main">NANDRoll</string>|' mobile/android/app/src/main/res/values/strings.xml
          grep -q 'applicationId "app.nandroll.celular"' mobile/android/app/build.gradle
          grep -q '<string name="app_name">NANDRoll</string>' mobile/android/app/src/main/res/values/strings.xml

      # A mesma assinatura em todo APK: sem isso o Android recusa a atualização
      # por cima do anterior, e desinstalar apagaria a lista guardada no aparelho.
      - name: Assinatura de teste fixa
        run: |
          mkdir -p ~/.android
          cp mobile/android/nandroll-debug.keystore ~/.android/debug.keystore

      - name: Interface do celular
        working-directory: mobile
        run: |
          node montar.js
          npx cap sync android

      - name: APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nome do arquivo
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk NANDRoll-teste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NANDRoll-teste
          path: NANDRoll-teste.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="APK de teste do NANDRoll, montado sozinho a partir do commit ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}). Baixe o .apk no celular e abra para instalar."
          if gh release view nandroll-teste >/dev/null 2>&1; then
            gh release upload nandroll-teste NANDRoll-teste.apk --clobber
            gh release edit nandroll-teste --notes "$NOTAS"
          else
            gh release create nandroll-teste NANDRoll-teste.apk --prerelease --title "NANDRoll: APK de teste" --notes "$NOTAS" --target "$GITHUB_SHA"
          fi
